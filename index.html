<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fach-Vokabeln</title>
<meta name="description" content="Fachbegriffe lernen: Quiz, Karteikarten und Nachschlagen.">
<meta name="theme-color" content="#0d0305">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  /* Zuletzt genutztes Farbschema sofort setzen, damit beim Start nichts aufblitzt */
  try { const t = JSON.parse(localStorage.getItem("lernapp.theme") || "{}");
    for (const k in t) document.documentElement.style.setProperty("--" + k, t[k]); } catch (e) {}
</script>
</head>
<body>
<div class="wrap">
  <header class="top" id="top"></header>
  <main id="app" aria-live="polite"></main>
</div>
<script src="app.js"></script>
</body>
</html>
